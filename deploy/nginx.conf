# Optional: Nginx reverse proxy for Lotus Asset Management
# Place in /etc/nginx/sites-available/lotus-asset-management
# Then: sudo ln -s /etc/nginx/sites-available/lotus-asset-management /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or VPS IP

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:16345;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        alias /var/www/lotus-asset-management/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
